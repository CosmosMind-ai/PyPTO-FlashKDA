[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pypto-flashkda"
version = "0.1.0"
description = "Kimi Delta Attention (KDA) kernels for Ascend 910C in PyPTO"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["torch"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["flash_kda*"]
